[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-aldoc"
version = "0.0.0"
description = "MkDocs plugin for AL (Microsoft Dynamics 365 Business Central) documentation"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Panda Coop" }]
classifiers = [
    "Development Status :: 1 - Planning",
]

[project.urls]
Homepage = "https://github.com/panda-coop/mkdocs-aldoc"
